services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: envmon
      POSTGRES_USER: envmon
      POSTGRES_PASSWORD: envmon
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envmon -d envmon"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://envmon:envmon@db:5432/envmon
      DELIVERY_DIR: /data/deliveries
    volumes:
      - deliveries:/data/deliveries
    depends_on:
      db:
        condition: service_healthy
    # 交付"退出重启演示"：进程硬退出（os._exit，退出码非 0）后容器自动拉起，
    # 启动时未完成的交付从原固定快照续跑，已完成交付字节不变。
    restart: on-failure
    ports:
      - "8000:8000"

volumes:
  pgdata:
  deliveries:
